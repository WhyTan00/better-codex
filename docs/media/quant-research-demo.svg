<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">whytan Better Codex quant research demo</title>
  <desc id="desc">A sanitized quant research cockpit using synthetic paper-only data. No tickers, accounts, orders, or provider credentials are shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c17"/><stop offset="1" stop-color="#151325"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7dd3fc"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/><rect x="20" y="20" width="1560" height="960" rx="22" fill="none" stroke="#c2d4ee" stroke-opacity=".16"/>
  <circle cx="1400" cy="-80" r="420" fill="#4b316f" opacity=".18"/>
  <rect x="44" y="44" width="1512" height="78" rx="16" fill="#0a0f1c" stroke="#c2d4ee" stroke-opacity=".12"/>
  <rect x="70" y="62" width="44" height="44" rx="12" fill="#30264d" stroke="#f7c978" stroke-opacity=".40"/><text x="92" y="92" fill="#f7c978" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">Q</text>
  <text x="132" y="83" fill="#edf3ff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">whytan / Quant Research</text><text x="132" y="104" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="13">Better Codex project adapter · static public demo</text>
  <rect x="1265" y="65" width="265" height="34" rx="17" fill="#f7c978" fill-opacity=".09" stroke="#f7c978" stroke-opacity=".40"/><text x="1397" y="87" fill="#f7d99a" font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">SYNTHETIC · PAPER ONLY</text>

  <rect x="44" y="144" width="278" height="812" rx="18" fill="#0a0f1c" stroke="#c2d4ee" stroke-opacity=".12"/>
  <text x="72" y="194" fill="#edf3ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Research cockpit</text><text x="72" y="230" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="2">PROJECT SCOPE</text>
  <rect x="70" y="246" width="226" height="46" rx="10" fill="#111a2b" stroke="#f7c978" stroke-opacity=".28"/><text x="87" y="275" fill="#edf3ff" font-family="Inter,Arial,sans-serif" font-size="14">Sandbox / paper</text><text x="270" y="275" fill="#f7c978" font-size="15">⌄</text>
  <text x="72" y="344" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="2">PIPELINE</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14"><rect x="62" y="364" width="242" height="44" rx="9" fill="#f7c978" fill-opacity=".10"/><text x="84" y="392" fill="#edf3ff">01  Universe</text><text x="84" y="444" fill="#92a0b7">02  Signal lab</text><text x="84" y="496" fill="#92a0b7">03  Backtest</text><text x="84" y="548" fill="#92a0b7">04  Review gate</text></g>
  <line x1="70" y1="856" x2="296" y2="856" stroke="#c2d4ee" stroke-opacity=".12"/><text x="72" y="900" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="12">No broker connection</text><text x="72" y="924" fill="#9ee8c8" font-family="Inter,Arial,sans-serif" font-size="12">✓ trade actions disabled</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="360" y="194" fill="#92a0b7" font-size="11" letter-spacing="2">RESEARCH SNAPSHOT</text><text x="360" y="236" fill="#edf3ff" font-size="30" font-weight="700">Signal lab · synthetic split</text><text x="360" y="268" fill="#92a0b7" font-size="14">A reviewable view over candidate evidence, not a live portfolio.</text>
    <rect x="360" y="304" width="260" height="132" rx="14" fill="#111a2b" stroke="#c2d4ee" stroke-opacity=".14"/><text x="384" y="338" fill="#92a0b7" font-size="11">CANDIDATES</text><text x="384" y="390" fill="#f7c978" font-family="ui-monospace,monospace" font-size="38">12</text><text x="384" y="416" fill="#92a0b7" font-size="12">synthetic feature sets</text>
    <rect x="638" y="304" width="260" height="132" rx="14" fill="#111a2b" stroke="#c2d4ee" stroke-opacity=".14"/><text x="662" y="338" fill="#92a0b7" font-size="11">ANNUALIZED SHARPE</text><text x="662" y="390" fill="#7dd3fc" font-family="ui-monospace,monospace" font-size="38">1.42</text><text x="662" y="416" fill="#92a0b7" font-size="12">paper backtest only</text>
    <rect x="916" y="304" width="260" height="132" rx="14" fill="#111a2b" stroke="#c2d4ee" stroke-opacity=".14"/><text x="940" y="338" fill="#92a0b7" font-size="11">MAX DRAWDOWN</text><text x="940" y="390" fill="#a78bfa" font-family="ui-monospace,monospace" font-size="38">−8.6%</text><text x="940" y="416" fill="#92a0b7" font-size="12">synthetic period</text>

    <rect x="360" y="466" width="816" height="292" rx="16" fill="#0d1321" stroke="#c2d4ee" stroke-opacity=".14"/><text x="388" y="506" fill="#edf3ff" font-size="16" font-weight="700">Equity curve · normalized to 100</text><text x="1148" y="506" fill="#92a0b7" font-size="12" text-anchor="end">2024–2025 synthetic</text>
    <line x1="402" y1="690" x2="1134" y2="690" stroke="#c2d4ee" stroke-opacity=".12"/><line x1="402" y1="590" x2="1134" y2="590" stroke="#c2d4ee" stroke-opacity=".08"/><line x1="402" y1="540" x2="1134" y2="540" stroke="#c2d4ee" stroke-opacity=".08"/>
    <polyline points="402,672 452,650 502,663 552,612 602,624 652,580 702,594 752,550 802,568 852,520 902,535 952,500 1002,518 1052,470 1102,486 1134,454" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1134" cy="454" r="7" fill="#7dd3fc"/><text x="402" y="724" fill="#92a0b7" font-size="11">split A</text><text x="1134" y="724" fill="#92a0b7" font-size="11" text-anchor="end">split B</text>

    <rect x="360" y="788" width="816" height="168" rx="16" fill="#111a2b" stroke="#c2d4ee" stroke-opacity=".14"/><text x="388" y="826" fill="#92a0b7" font-size="11" letter-spacing="2">ADMISSION GATE</text><text x="388" y="862" fill="#edf3ff" font-size="17" font-weight="700">Observation → replay → human decision</text><text x="388" y="892" fill="#92a0b7" font-size="13">This public view stops before credentials, broker login, orders, or live execution.</text><rect x="388" y="914" width="175" height="26" rx="13" fill="#f7c978" fill-opacity=".10" stroke="#f7c978" stroke-opacity=".36"/><text x="475" y="932" fill="#f7d99a" font-size="11" text-anchor="middle">WAITING FOR REVIEW</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">whytan Better Codex video production demo</title>
  <desc id="desc">A sanitized static video production cockpit with storyboard cards, a Remotion timeline, and a local render status. All media labels are synthetic.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c17"/><stop offset="1" stop-color="#181124"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f8a8cf"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/><rect x="20" y="20" width="1560" height="960" rx="22" fill="none" stroke="#c2d4ee" stroke-opacity=".16"/>
  <circle cx="1400" cy="-40" r="430" fill="#753d72" opacity=".18"/>
  <rect x="44" y="44" width="1512" height="78" rx="16" fill="#0a0f1c" stroke="#c2d4ee" stroke-opacity=".12"/>
  <rect x="70" y="62" width="44" height="44" rx="12" fill="#452a4c" stroke="#f8a8cf" stroke-opacity=".40"/><text x="92" y="92" fill="#f8a8cf" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">V</text>
  <text x="132" y="83" fill="#edf3ff" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">whytan / Video Production</text><text x="132" y="104" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="13">Better Codex project adapter · static public demo</text>
  <rect x="1300" y="65" width="230" height="34" rx="17" fill="#34d399" fill-opacity=".09" stroke="#34d399" stroke-opacity=".34"/><circle cx="1323" cy="82" r="5" fill="#34d399"/><text x="1338" y="87" fill="#baf4d8" font-family="Inter,Arial,sans-serif" font-size="13">LOCAL PREVIEW READY</text>

  <rect x="44" y="144" width="278" height="812" rx="18" fill="#0a0f1c" stroke="#c2d4ee" stroke-opacity=".12"/>
  <text x="72" y="194" fill="#edf3ff" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Video workbench</text><text x="72" y="230" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="2">PROJECT</text>
  <rect x="70" y="246" width="226" height="46" rx="10" fill="#111a2b" stroke="#f8a8cf" stroke-opacity=".28"/><text x="87" y="275" fill="#edf3ff" font-family="Inter,Arial,sans-serif" font-size="14">Better Codex explainer</text><text x="270" y="275" fill="#f8a8cf" font-size="15">⌄</text>
  <text x="72" y="344" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="11" letter-spacing="2">SCENES</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14"><rect x="62" y="364" width="242" height="44" rx="9" fill="#f8a8cf" fill-opacity=".10"/><text x="84" y="392" fill="#edf3ff">01  One owner</text><text x="84" y="444" fill="#92a0b7">02  Local-first</text><text x="84" y="496" fill="#92a0b7">03  Project views</text><text x="84" y="548" fill="#92a0b7">04  Close</text></g>
  <line x1="70" y1="856" x2="296" y2="856" stroke="#c2d4ee" stroke-opacity=".12"/><text x="72" y="900" fill="#92a0b7" font-family="Inter,Arial,sans-serif" font-size="12">Remotion composition</text><text x="72" y="924" fill="#9ee8c8" font-family="Inter,Arial,sans-serif" font-size="12">✓ deterministic captions</text>

  <g font-family="Inter,Arial,sans-serif">
    <text x="360" y="194" fill="#92a0b7" font-size="11" letter-spacing="2">STORYBOARD / REMOTION</text><text x="360" y="236" fill="#edf3ff" font-size="30" font-weight="700">Better Codex explainer</text><text x="360" y="268" fill="#92a0b7" font-size="14">Static media preview: no private frames, credentials, or production endpoints.</text>
    <rect x="360" y="304" width="816" height="250" rx="16" fill="#0d1321" stroke="#c2d4ee" stroke-opacity=".14"/>
    <rect x="388" y="332" width="232" height="166" rx="12" fill="#111a2b" stroke="#7dd3fc" stroke-opacity=".28"/><rect x="406" y="350" width="196" height="103" rx="8" fill="#14253a"/><circle cx="504" cy="401" r="26" fill="#7dd3fc" fill-opacity=".12"/><text x="504" y="410" fill="#7dd3fc" font-size="28" text-anchor="middle">B</text><text x="406" y="480" fill="#edf3ff" font-size="12" font-weight="700">Scene 01 · one owner</text><text x="406" y="497" fill="#92a0b7" font-size="11">native Harness architecture</text>
    <rect x="648" y="332" width="232" height="166" rx="12" fill="#111a2b" stroke="#a78bfa" stroke-opacity=".28"/><rect x="666" y="350" width="196" height="103" rx="8" fill="#211d3f"/><rect x="689" y="371" width="150" height="12" rx="6" fill="#a78bfa" fill-opacity=".35"/><rect x="689" y="398" width="120" height="8" rx="4" fill="#92a0b7" fill-opacity=".35"/><rect x="689" y="421" width="140" height="8" rx="4" fill="#34d399" fill-opacity=".50"/><text x="666" y="480" fill="#edf3ff" font-size="12" font-weight="700">Scene 02 · local-first</text><text x="666" y="497" fill="#92a0b7" font-size="11">confirmed state transition</text>
    <rect x="908" y="332" width="232" height="166" rx="12" fill="#111a2b" stroke="#f8a8cf" stroke-opacity=".28"/><rect x="926" y="350" width="196" height="103" rx="8" fill="#382342"/><circle cx="958" cy="383" r="12" fill="#f8a8cf" fill-opacity=".34"/><circle cx="1000" cy="425" r="17" fill="#f7c978" fill-opacity=".30"/><path d="M1030 433 C1050 390 1082 395 1104 370" fill="none" stroke="#7dd3fc" stroke-width="5"/><text x="926" y="480" fill="#edf3ff" font-size="12" font-weight="700">Scene 03 · project views</text><text x="926" y="497" fill="#92a0b7" font-size="11">quant + video adapters</text>

    <rect x="360" y="584" width="816" height="198" rx="16" fill="#111a2b" stroke="#c2d4ee" stroke-opacity=".14"/><text x="388" y="622" fill="#edf3ff" font-size="16" font-weight="700">Timeline</text><text x="1148" y="622" fill="#92a0b7" font-size="12" text-anchor="end">32 sec · 30 fps</text>
    <line x1="388" y1="665" x2="1148" y2="665" stroke="#c2d4ee" stroke-opacity=".20"/><g fill="#92a0b7" font-size="11"><text x="388" y="650">00:00</text><text x="575" y="650">00:08</text><text x="765" y="650">00:16</text><text x="955" y="650">00:24</text><text x="1110" y="650">00:32</text></g>
    <rect x="388" y="690" width="178" height="36" rx="8" fill="#7dd3fc" fill-opacity=".18"/><text x="477" y="713" fill="#bdeaff" font-size="12" text-anchor="middle">architecture</text><rect x="574" y="690" width="232" height="36" rx="8" fill="#a78bfa" fill-opacity=".18"/><text x="690" y="713" fill="#d9d0ff" font-size="12" text-anchor="middle">local-first</text><rect x="814" y="690" width="214" height="36" rx="8" fill="#f8a8cf" fill-opacity=".18"/><text x="921" y="713" fill="#ffd1e6" font-size="12" text-anchor="middle">project views</text><rect x="1036" y="690" width="112" height="36" rx="8" fill="#34d399" fill-opacity=".18"/><text x="1092" y="713" fill="#baf4d8" font-size="12" text-anchor="middle">close</text>
    <rect x="360" y="812" width="816" height="144" rx="16" fill="#0d1321" stroke="#34d399" stroke-opacity=".25"/><text x="388" y="850" fill="#92a0b7" font-size="11" letter-spacing="2">RENDER STATUS</text><text x="388" y="890" fill="#baf4d8" font-size="18" font-weight="700">✓ 960 / 960 frames · local MP4 ready</text><text x="388" y="920" fill="#92a0b7" font-size="13">Captions and product facts are code-authored; this preview contains synthetic project labels.</text><rect x="1000" y="870" width="148" height="32" rx="16" fill="url(#pink)"/><text x="1074" y="891" fill="#1b1020" font-size="12" font-weight="700" text-anchor="middle">OPEN TIMELINE ↗</text>
  </g>
</svg>

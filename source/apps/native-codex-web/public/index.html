<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#f7f7f5"><title>Codex · 私人工作台</title><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="/style.css"></head><body>
<div id="app">
<header><button id="back" class="icon" aria-label="返回会话列表" hidden>‹</button><a class="brand" href="/" aria-label="Codex 首页"><span class="mark">⌘</span><span>Codex <small>私人工作台</small></span></a><select id="workspace" aria-label="切换工作区"><option value="ai">AI · 我的工作区</option><option value="secondary">SECONDARY · 创作工作区</option></select></header>
<nav aria-label="主导航"><button id="chat-tab" class="selected">聊天</button><button id="workbench-tab">工作台</button><span id="connection" role="status">正在连接</span><button id="reconnect" hidden>重新连接</button></nav>
<div id="notice" role="status" hidden></div>
<main>
<section id="catalog" aria-label="会话目录"><div class="section-head"><div><p class="eyebrow">你的思考，继续发生</p><h1>会话</h1></div><button id="new" class="primary">＋ 新建会话</button></div><label class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索此工作区会话" aria-label="搜索此工作区会话"></label><div id="thread-list"></div><button id="more-threads" class="load-more" hidden>加载更多会话</button><p class="hint">家庭共享登录 · 两个工作区分别展示<br>外部 CLI / Desktop 会话可阅读，续接请回原宿主。</p></section>
<section id="conversation" aria-label="聊天详情" hidden><div class="conversation-head"><div><h1 id="thread-title">新会话</h1><p id="thread-status" class="hint"></p></div><button id="refresh-thread" class="quiet">核对状态</button></div><div id="transcript" role="log" aria-label="会话内容"><button id="older" class="load-more" hidden>加载更早的轮次</button><div id="messages"></div><div id="empty-thread"><span class="empty-mark">⌘</span><h2>从一个想法开始</h2><p>描述你想完成的事，Codex 会在当前工作区继续。</p></div></div><div id="approvals" aria-live="polite"></div><form id="composer"><div id="attachment-list"></div><label class="sr-only" for="prompt">给 Codex 的消息</label><textarea id="prompt" rows="2" placeholder="想一起完成什么？"></textarea><div class="composer-actions"><label class="attach" tabindex="0">＋ 附件<input id="file" type="file" accept=".txt,.md,image/png,image/jpeg,image/webp" multiple hidden></label><span id="composer-hint">Enter 发送 · Shift+Enter 换行</span><button id="stop" type="button" hidden>■ 停止</button><button id="send" type="submit" class="primary">发送 ↑</button></div></form><p class="footnote" id="ownership-note">原生 Codex 执行 · 页面关闭后任务继续</p></section>
<section id="workbench" aria-label="业务工作台" hidden><div class="section-head"><div><p class="eyebrow">专属于当前工作区</p><h1>工作台</h1></div></div><div id="plugin-list"></div><div id="plugin-detail" hidden></div><p class="hint">插件独立加载。此处入口与数据由服务端工作区范围决定。</p></section>
</main>
</div><script type="module" src="/app.mjs"></script></body></html>

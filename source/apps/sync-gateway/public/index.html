<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)"><link id="app-manifest" rel="manifest" crossorigin="use-credentials" href="/app/manifest.webmanifest"><link rel="icon" href="/app/assets/icon.svg"><style>:root{color-scheme:light dark;background:#fff;color:#0d0d0d}html,body,#app{background:#fff}@media(prefers-color-scheme:dark){:root,html,body,#app{background:#000;color:#f5f5f5}}</style><script type="module" src="/app/assets/theme.mjs?v=20260910-4"></script><title>Codex 工作台</title><link rel="stylesheet" href="/app/assets/app.css?v=20260910-4"><script type="module" src="/app/assets/app.mjs?v=20260910-4"></script></head>
<body class="outer-list"><div id="app"><aside id="sidebar"><header><a class="brand" href="/app?workspace=ai">Codex</a><select id="workspace" aria-label="工作区"><option value="ai">AI 工作区</option><option value="secondary">SECONDARY 工作区</option></select></header><button id="new" class="new">＋ 新对话</button><input id="search" type="search" placeholder="搜索会话" aria-label="搜索会话"><div id="notice" role="status" hidden></div><a id="login-link" href="/app?workspace=ai" hidden>重新登录</a><nav id="threads" aria-label="会话列表"></nav><button id="more-threads" hidden>加载更多会话</button><footer><a href="/workbench?workspace=ai" id="workbench">工作台</a><span id="list-status">正在连接</span></footer></aside><main><header class="conversation-header"><button id="back" aria-label="返回会话列表">‹</button><div class="heading"><h1 id="title">选择或新建一个对话</h1><span id="status" role="status">正在连接</span></div><a id="full-view" href="/ui/official?workspace=ai">完整界面 ↗</a></header><section id="transcript" aria-label="会话内容"><button id="older" hidden>加载更早的回合</button><div id="messages"></div><div id="empty">从左侧选择对话，或开始新的任务。</div></section><div id="approvals"></div><form id="composer" hidden><div class="editor"><textarea id="prompt" rows="2" placeholder="随心输入" aria-label="消息内容"></textarea><div class="composer-actions"><span id="model">Codex</span><button type="button" id="check" hidden>核对发送状态</button><button type="button" id="stop" hidden>停止</button><button type="submit" id="send" class="primary">发送 ↑</button></div></div><p class="hint">Enter 发送 · Shift + Enter 换行<span class="mobile-hint">在其他端的更新会自动同步</span></p></form></main></div><dialog id="thread-menu"><h2 id="menu-title"></h2><button id="menu-pin">置顶</button><a id="menu-full">在完整界面打开</a><button id="menu-close">取消</button></dialog></body></html>

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#faf9f6"><title>Codex · 私人工作台</title><link rel="stylesheet" href="/native/style.css"><script type="module" src="/native/app.js"></script></head>
<body><div id="app"><aside id="sidebar"><div class="brand">◉ <strong>Codex</strong><span>私人工作台</span></div><label class="workspace-label" for="workspace">工作区</label><select id="workspace"><option value="ai">AI 工作区</option><option value="secondary">SECONDARY 创作工作区</option></select><button id="new" class="primary">＋ 新对话</button><button id="workbench">▦ 工作台</button><input id="search" type="search" placeholder="搜索本工作区对话" aria-label="搜索本工作区对话"><div class="section-label">对话</div><nav id="threads" aria-label="对话列表"></nav><button id="more-threads" hidden>加载更多对话</button><footer>原生 Codex Harness<br><small>共用登录 · 工作区独立展示</small></footer></aside>
<main><header><button id="back" aria-label="返回对话列表">☰</button><div><strong id="title">开始一段对话</strong><small id="model">Astra · high · 普通速度</small></div><span id="connection" role="status">连接中</span></header><div id="notice" role="status"></div><section id="chat"><button id="older" hidden>加载更早的消息</button><div id="messages"><div class="welcome"><div class="glyph">✳</div><h1>今天，想完成什么？</h1><p>从一个问题或一个具体任务开始。</p></div></div><div id="approvals"></div></section><section id="plugins" hidden></section>
<form id="composer"><div id="attachment-list"></div><textarea id="prompt" rows="2" placeholder="给 Codex 发送消息…" aria-label="消息"></textarea><div class="composer-actions"><label class="attach" for="attachment">＋ 附件</label><input id="attachment" type="file" accept="image/png,image/jpeg,image/webp,.txt,.md,.csv,.json" multiple hidden><span id="run-status">准备就绪</span><button id="stop" type="button" hidden>停止</button><button id="send" class="primary" type="submit">发送 ↑</button></div><small class="hint">图片与文本附件 · Enter 发送，Shift + Enter 换行</small></form></main></div></body></html>
